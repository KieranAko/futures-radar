# ga7-policy-calendar-v0.yaml — GA-7 政策日历 v0 最小集（falsification 数据前置）
#
# 维护：data-engineer-2（2026-08-28 构建）
# 用途：FS-04/FS-05/EC-01 政策窗口开窗 + 事件前提最小集；
#       完整事件集走 FS-09/M11 路线，本文件只做年份级窗口标注。
# 机器形态：data/ga7-policy-calendar-v0.json（由 ga7-calendar-sync.py 同步生成，ga7-f9-check.cjs 校验）
schema: futures-radar-ga7-policy-calendar/1
maintainedAt: '2026-08-28'
maintainer: data-engineer-2
description: 政策日历 v0 最小集（年份级事件窗口 + 重要月度发布日排期）
discipline: |
  F9：证伪测试只允许使用 event.date <= 锚点日 的事件；本日历只记录"发生了什么/日程上有什么"，
  不提供市场反应；禁止从价格反推事件后标注为真实事件；每条事件必须带 source；
  verified=false 的条目为官方惯例排期（schedule），只能当预期使用，不能当已核实结果；
  年份级窗口（date=窗口起点，end=窗口终点）仅用于样本分段/单列报告与联动暂停标注，不用于择时入场。
events:
