schedules:
  # 重要月度/周度发布日（官方惯例排期；verified=false，只能当日程预期）
  - type: china_pmi
    title: 中国官方 PMI（制造业/非制造业）
    rule: 每月最后一日或次月首个工作日
    scope: [RB0, black, macro]
    source: https://www.stats.gov.cn/sj/fbrc/bnxxfb/
  - type: china_cpi_ppi
    title: 中国 CPI/PPI
    rule: 每月 9-10 日左右（统计局发布日程）
    scope: [RB0, black, macro]
    source: https://www.stats.gov.cn/sj/fbrc/bnxxfb/
  - type: china_lpr
    title: 中国 LPR 报价
    rule: 每月 20 日（遇节假日顺延）
    scope: [RB0, black, macro]
    source: https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/125440/index.html
  - type: china_finance_data
    title: 中国金融数据（社融/M2/新增贷款）
    rule: 每月 10-15 日左右
    scope: [RB0, black, macro]
    source: https://www.pbc.gov.cn/diaochatongjisi/116219/index.html
  - type: fomc
    title: FOMC 议息会议
    rule: 每年 8 次会议（按美联储官方日历）
    scope: [SC0, macro, black]
    source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  - type: wasde
    title: USDA WASDE 月度供需报告
    rule: 每月 10 日前后
    scope: [M0, RM0, Y0, P0, C0, A0, agriculture]
    source: https://www.usda.gov/about-usda/general-information/staff-offices/office-chief-economist/commodity-markets/wasde-report
  - type: mpob
    title: MPOB 马来西亚棕榈油月度数据
    rule: 每月 10 日前后
    scope: [P0, Y0, M0, agriculture]
    source: https://www.mpob.gov.my/
  - type: eia_weekly
    title: EIA 周度原油库存
    rule: 每周（北京时间周三/四）
    scope: [SC0, FU0, LU0, BU0]
    source: https://www.eia.gov/
  - type: opec_meeting
    title: OPEC+ 会议/产量决定
    rule: 不定期（按 OPEC 官方日程）
    scope: [SC0, FU0, LU0, BU0]
    source: https://www.opec.org/
